name: Sync Project Date Fields

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC，这里等于东八区每天 23:50。
    - cron: '50 15 * * *'
  # 支持在 Actions 页面或 gh CLI 手动补跑一次。
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  repository-projects: write

concurrency:
  group: project-date-sync
  cancel-in-progress: false

jobs:
  sync-project-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync StartTime and EndTime
        uses: actions/github-script@v7
        env:
          HAS_PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN != '' }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          STATUS_FIELD_NAME: ${{ vars.PROJECT_STATUS_FIELD_NAME }}
          START_DATE_FIELD_NAME: ${{ vars.PROJECT_START_DATE_FIELD_NAME }}
          END_DATE_FIELD_NAME: ${{ vars.PROJECT_END_DATE_FIELD_NAME }}
          DOING_OPTION_NAME: ${{ vars.PROJECT_DOING_OPTION_NAME }}
          DONE_OPTION_NAME: ${{ vars.PROJECT_DONE_OPTION_NAME }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN || github.token }}
          script: |
            const core = require('@actions/core')

            const owner = process.env.PROJECT_OWNER || context.repo.owner
            const projectNumber = Number(process.env.PROJECT_NUMBER)
            const statusFieldName = process.env.STATUS_FIELD_NAME || 'Status'
            const startDateFieldName = process.env.START_DATE_FIELD_NAME || 'StartTime'
            const endDateFieldName = process.env.END_DATE_FIELD_NAME || 'EndTime'
            const doingOptionName = process.env.DOING_OPTION_NAME || 'In Progress'
            const doneOptionName = process.env.DONE_OPTION_NAME || 'Done'

            if (process.env.HAS_PROJECTS_TOKEN !== 'true') {
              core.warning('未配置 PROJECTS_TOKEN，当前将回退使用 GITHUB_TOKEN。若后续出现权限不足，请在仓库 Secrets 中配置具备 Projects 读写权限的 PROJECTS_TOKEN。')
            }

            if (!process.env.PROJECT_NUMBER) {
              core.setFailed('缺少仓库变量 PROJECT_NUMBER。请在 Settings -> Secrets and variables -> Actions -> Variables 中配置。')
              return
            }

            if (!Number.isInteger(projectNumber) || projectNumber <= 0) {
              core.setFailed(`PROJECT_NUMBER 必须是正整数，当前值为 ${process.env.PROJECT_NUMBER}`)
              return
            }

            function normalize(value) {
              return String(value || '').trim().toLowerCase()
            }

            function shanghaiDate() {
              const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
              }).formatToParts(new Date())
              const lookup = Object.fromEntries(parts.map((part) => [part.type, part.value]))
              return `${lookup.year}-${lookup.month}-${lookup.day}`
            }

            const projectQuery = `
              query($login: String!, $number: Int!) {
                organization(login: $login) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `

            const itemsQuery = `
              query($projectId: ID!, $after: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        id
                        content {
                          __typename
                          ... on DraftIssue {
                            title
                          }
                          ... on Issue {
                            title
                            number
                          }
                          ... on PullRequest {
                            title
                            number
                          }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2FieldCommon {
                                  id
                                  name
                                }
                              }
                            }
                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2FieldCommon {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `

            const updateDateMutation = `
              mutation($input: UpdateProjectV2ItemFieldValueInput!) {
                updateProjectV2ItemFieldValue(input: $input) {
                  projectV2Item {
                    id
                  }
                }
              }
            `

            const projectResponse = await github.graphql(projectQuery, {
              login: owner,
              number: projectNumber,
            })

            const project = projectResponse.organization?.projectV2 || projectResponse.user?.projectV2
            if (!project) {
              core.setFailed(`未找到 ${owner} 名下编号为 ${projectNumber} 的 ProjectV2。`)
              return
            }

            const fieldByName = new Map(
              (project.fields?.nodes || [])
                .filter((field) => field?.id && field?.name)
                .map((field) => [normalize(field.name), field]),
            )

            const statusField = fieldByName.get(normalize(statusFieldName))
            const startDateField = fieldByName.get(normalize(startDateFieldName))
            const endDateField = fieldByName.get(normalize(endDateFieldName))

            const missingFields = [
              !statusField && statusFieldName,
              !startDateField && startDateFieldName,
              !endDateField && endDateFieldName,
            ].filter(Boolean)

            if (missingFields.length > 0) {
              core.setFailed(`Project 中缺少字段：${missingFields.join('、')}`)
              return
            }

            const today = shanghaiDate()
            const updates = []

            let after = null
            do {
              const page = await github.graphql(itemsQuery, {
                projectId: project.id,
                after,
              })

              const items = page.node?.items?.nodes || []
              for (const item of items) {
                let statusValue = ''
                let startDate = ''
                let endDate = ''

                for (const fieldValue of item.fieldValues?.nodes || []) {
                  const fieldName = normalize(fieldValue.field?.name)
                  if (fieldName === normalize(statusFieldName) && typeof fieldValue.name === 'string') {
                    statusValue = fieldValue.name
                  }
                  if (fieldName === normalize(startDateFieldName) && typeof fieldValue.date === 'string') {
                    startDate = fieldValue.date
                  }
                  if (fieldName === normalize(endDateFieldName) && typeof fieldValue.date === 'string') {
                    endDate = fieldValue.date
                  }
                }

                const title = item.content?.title || item.id
                const normalizedStatus = normalize(statusValue)

                if (normalizedStatus === normalize(doingOptionName) && !startDate) {
                  updates.push({
                    itemId: item.id,
                    fieldId: startDateField.id,
                    fieldName: startDateFieldName,
                    title,
                  })
                }

                if (normalizedStatus === normalize(doneOptionName) && !endDate) {
                  updates.push({
                    itemId: item.id,
                    fieldId: endDateField.id,
                    fieldName: endDateFieldName,
                    title,
                  })
                }
              }

              after = page.node?.items?.pageInfo?.hasNextPage
                ? page.node.items.pageInfo.endCursor
                : null
            } while (after)

            if (updates.length === 0) {
              core.info(`Project ${project.title} 没有需要补写的日期字段。`)
              return
            }

            core.info(`将使用东八区日期 ${today} 更新 ${updates.length} 个字段。`)

            for (const update of updates) {
              await github.graphql(updateDateMutation, {
                input: {
                  projectId: project.id,
                  itemId: update.itemId,
                  fieldId: update.fieldId,
                  value: {
                    date: today,
                  },
                },
              })

              core.info(`已将 ${update.title} 的 ${update.fieldName} 设为 ${today}`)
            }
